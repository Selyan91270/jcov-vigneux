# Configuration Netlify.
# Si vous déployez sur Cloudflare Pages, ce fichier est simplement ignoré :
# les en-têtes sont dans public/_headers, lu par les deux hébergeurs.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Même version majeure de Node que celle utilisée en développement.
  NODE_VERSION = "22"
