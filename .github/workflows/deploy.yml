name: Déploiement sur GitHub Pages

# Publie le site à chaque envoi sur la branche principale.
# « Run workflow » permet aussi de relancer une publication à la main.
on:
  push:
    branches: [master, main]
  # Reconstruction quotidienne : le tri « à venir / passé » des événements est
  # calculé au moment du build. Le navigateur le corrige déjà à l'affichage,
  # mais republier chaque nuit garde le HTML servi juste pour les moteurs de
  # recherche et les visiteurs sans JavaScript. 4 h UTC, hors heure de pointe.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

# Droits minimum nécessaires à la publication sur Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; les envois rapprochés ne s'écrasent pas
# en cours de route.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Installe exactement les versions du package-lock.
      - run: npm ci

      # Prépare la publication Pages. Ses sorties `origin` et `base_path`
      # servaient à renseigner l'adresse du site : on ne s'en sert plus.
      # Elles décrivent l'adresse *GitHub* du dépôt, pas le domaine du club,
      # et ont continué d'annoncer le sous-dossier /jcov-vigneux après le
      # branchement de jcov.fr — ce qui a mis le site en panne. L'adresse
      # publique est désormais fixée dans astro.config.mjs.
      - uses: actions/configure-pages@v5

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

      # Prévient Bing et Copilot que les pages ont changé, sans attendre leur
      # prochain passage. C'est le mécanisme qu'ils réclament nommément dans
      # leurs règles ; sans lui, un site neuf peut rester des semaines
      # « connu mais non indexé ».
      #
      # Une soumission par adresse plutôt qu'un lot : Bing indique que les
      # envois au fil de l'eau sont traités plus vite.
      #
      # La clé est publique par conception — elle prouve seulement qu'on
      # contrôle le domaine, puisqu'elle est lisible sur le site lui-même.
      - name: Signaler les pages à IndexNow
        run: |
          KEY=6cd932d74f99d78e2336d063aee9645d
          for page in "" horaires/ professeurs/ evenements/ galerie/ inscription/ code-moral/; do
            url="https://jcov.fr/${page}"
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://api.indexnow.org/indexnow?url=${url}&key=${KEY}&keyLocation=https://jcov.fr/${KEY}.txt")
            echo "  ${code}  ${url}"
          done
