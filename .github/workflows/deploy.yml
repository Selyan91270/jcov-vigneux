name: Déploiement sur GitHub Pages

# Publie le site à chaque envoi sur la branche principale.
# « Run workflow » permet aussi de relancer une publication à la main.
on:
  push:
    branches: [master, main]
  # Reconstruction quotidienne : le tri « à venir / passé » des événements est
  # calculé au moment du build. Le navigateur le corrige déjà à l'affichage,
  # mais republier chaque nuit garde le HTML servi juste pour les moteurs de
  # recherche et les visiteurs sans JavaScript. 4 h UTC, hors heure de pointe.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

# Droits minimum nécessaires à la publication sur Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; les envois rapprochés ne s'écrasent pas
# en cours de route.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # L'historique complet est nécessaire : la date de modification de chaque
      # page, dans le plan du site, est tirée de `git log` (src/lib/lastmod.mjs).
      # Avec la copie superficielle par défaut, toutes les pages auraient la
      # même date ; le script préfère alors n'en donner aucune.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Installe exactement les versions du package-lock.
      - run: npm ci

      # Contrôle des types et du contenu avant de construire. Sans lui, la
      # publication ne vérifiait que « le build passe » : mettre `astro` à
      # jour sans relever `zod` en même temps produisait 43 erreurs de types
      # que le build laissait passer en silence. Une erreur ici arrête la
      # publication, et le site en ligne reste celui de la veille.
      - run: npx astro check

      # Prépare la publication Pages. Ses sorties `origin` et `base_path`
      # servaient à renseigner l'adresse du site : on ne s'en sert plus.
      # Elles décrivent l'adresse *GitHub* du dépôt, pas le domaine du club,
      # et ont continué d'annoncer le sous-dossier /jcov-vigneux après le
      # branchement de jcov.fr — ce qui a mis le site en panne. L'adresse
      # publique est désormais fixée dans astro.config.mjs.
      - uses: actions/configure-pages@v5

      # Dernier flux Instagram valide. Le flux est régénéré à chaque passage
      # mais n'est pas versionné : sans cette restauration, une synchronisation
      # qui échoue (jeton expiré, panne d'Instagram) ferait disparaître d'un
      # coup toutes les publications du site au lieu de laisser les dernières.
      # La clé change à chaque exécution pour que le cache soit toujours
      # réenregistré ; `restore-keys` reprend le plus récent.
      - name: Restaurer le dernier flux Instagram
        uses: actions/cache@v4
        with:
          path: |
            src/data/instagram.generated.json
            public/instagram
          key: instagram-${{ github.run_id }}
          restore-keys: instagram-

      # Sans aucun des deux secrets (INSTAGRAM_FEED_URL pour un flux Behold,
      # INSTAGRAM_TOKEN pour l'API officielle), cette étape ne fait rien et ne
      # fait jamais échouer la publication : voir scripts/sync-instagram.mjs.
      - name: Synchroniser les publications Instagram
        run: node scripts/sync-instagram.mjs
        env:
          INSTAGRAM_FEED_URL: ${{ secrets.INSTAGRAM_FEED_URL }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

      # Prévient Bing et Copilot que les pages ont changé, sans attendre leur
      # prochain passage. C'est le mécanisme qu'ils réclament nommément dans
      # leurs règles ; sans lui, un site neuf peut rester des semaines
      # « connu mais non indexé ».
      #
      # Une soumission par adresse plutôt qu'un lot : Bing indique que les
      # envois au fil de l'eau sont traités plus vite.
      #
      # La clé est publique par conception — elle prouve seulement qu'on
      # contrôle le domaine, puisqu'elle est lisible sur le site lui-même.
      #
      # Uniquement lors d'un vrai envoi de code. La reconstruction de chaque
      # nuit republie un contenu inchangé : signaler sept pages « modifiées »
      # tous les jours, c'est exactement ce qu'IndexNow demande de ne pas
      # faire, et cela peut faire ignorer les vraies mises à jour.
      - name: Signaler les pages à IndexNow
        if: github.event_name == 'push'
        run: |
          KEY=6cd932d74f99d78e2336d063aee9645d
          for page in "" horaires/ professeurs/ evenements/ galerie/ inscription/ code-moral/; do
            url="https://jcov.fr/${page}"
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://api.indexnow.org/indexnow?url=${url}&key=${KEY}&keyLocation=https://jcov.fr/${KEY}.txt")
            echo "  ${code}  ${url}"
          done

  # GitHub désactive les workflows planifiés d'un dépôt public après 60 jours
  # sans activité. La reconstruction de chaque nuit — qui archive les
  # événements passés et synchronise Instagram — s'arrêterait alors sans
  # bruit, dès que plus personne ne publie rien pendant deux mois.
  #
  # Appeler l'API d'activation d'un workflow remet ce délai à zéro, sans
  # créer le moindre commit (technique reprise de liskin/gh-workflow-keepalive).
  # Un échec ici n'empêche pas la publication : il est signalé, pas bloquant.
  keepalive:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Renouveler le délai d'inactivité
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/enable" \
            && echo "Délai d'inactivité renouvelé." \
            || echo "::warning title=Keepalive::Impossible de renouveler le délai de 60 jours : les exécutions planifiées pourraient s'arrêter sans activité."
